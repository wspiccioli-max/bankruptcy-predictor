name: Refresh S&P 500 data

# Runs every Sunday at 22:00 UTC (6pm ET / 3pm PT) — after markets close
# and most companies have finished filing. You can also trigger manually
# from the GitHub Actions tab using the "Run workflow" button.
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch: {}

# Give the workflow permission to push commits back to the repo
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build model artifact
        run: |
          python feature_engineering.py
          python train_models.py

      - name: Run S&P 500 refresh
        run: python refresh_sp500.py

      - name: Commit and push updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/model_comparison.csv data/processed/predictions.csv data/processed/feature_importance.csv data/processed/training_metadata.json data/processed/sp500_predictions.csv data/raw/sp500_list.csv
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore: weekly S&P 500 data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
